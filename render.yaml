databases:
  - name: appetit-db
    databaseName: appetit
    user: appetit

services:
  - type: web
    name: appetit-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm -C apps/api generate && pnpm -C apps/api build
    startCommand: pnpm -C apps/api db:push && pnpm -C apps/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: appetit-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        value: https://appetit-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: TG_BOT_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
    disk:
      name: appetit-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: appetit-web
    runtime: node
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm -C apps/web build
    startCommand: pnpm -C apps/web start
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://appetit-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_TG_BOT_NAME
        sync: false
      - key: NEXT_PUBLIC_TG_LANG
        value: ru
      - key: NEXT_PUBLIC_YANDEX_MAPS_API_KEY
        sync: false
